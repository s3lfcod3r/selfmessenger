# SelfMessenger TURN (coturn) — kostenloser Relay-Fallback für P2P hinter NAT/Mobilfunk.
# Der Relay sieht NUR verschlüsselten DTLS-SRTP-/DataChannel-Verkehr, niemals Klartext.
#
# Vor dem Start ZWEI Platzhalter ersetzen:
#   __REPLACE_SECRET__  -> ein zufälliges Geheimnis (openssl rand -hex 32)
#   __PUBLIC_IP__       -> deine öffentliche IP (dieselbe, die der Worker als TURN_URL nennt)

listening-port=3478

# Relay-Portbereich bewusst klein (diese UDP-Ports am Router auf den Unraid-Host weiterleiten!)
min-port=49160
max-port=49200

# Authentifizierung per Kurzzeit-Zugangsdaten (TURN-REST / use-auth-secret).
# Dasselbe Geheimnis kennt der Cloudflare-Worker (Secret TURN_SECRET) und mintet daraus
# ablaufende Zugangsdaten — es steht NIE im Client.
use-auth-secret
static-auth-secret=__REPLACE_SECRET__
realm=selfmessenger

# Öffentliche IP, die coturn den Clients nennt (Router leitet auf den Unraid-Host weiter).
external-ip=__PUBLIC_IP__

# --- Härtung: kein Relay ins LAN, in Metadaten oder Loopback (verhindert Missbrauch als Innen-Proxy) ---
no-multicast-peers
no-loopback-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# --- Betrieb ---
fingerprint
stale-nonce=600
no-cli
no-tlsv1
no-tlsv1_1
# TLS/DTLS (Port 5349 + Zertifikat) ist optional und hier bewusst aus — reiner UDP/TCP-TURN.
# Der übertragene Medien-/Datenstrom ist bereits Ende-zu-Ende verschlüsselt.
